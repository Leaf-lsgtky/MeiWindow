name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Parse version from tag
        id: v
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          name="${tag#v}"
          case "$name" in
            *.*.*) ;;
            *) echo "::error::tag '$tag' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          major="${name%%.*}"
          rest="${name#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Build Release APK
        env:
          SIGNING_STORE_FILE: release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            "-PversionName=${{ steps.v.outputs.name }}" \
            "-PversionCode=${{ steps.v.outputs.code }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/MeiWindow-${{ steps.v.outputs.tag }}.apk"

      - name: Verify LSPosed Metadata
        run: |
          set -euo pipefail
          apk=$(ls dist/*.apk)
          unzip -p "$apk" META-INF/xposed/java_init.list | grep -qx 'com.repl.bubbledrawer.xposed.ModuleMain'
          unzip -p "$apk" META-INF/xposed/scope.list | grep -qx 'com.android.systemui'
          echo "LSPosed entry point and scope verified."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.v.outputs.tag }}"
          git tag -l --format='%(contents)' "$tag" > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            git log --no-merges --pretty='- %s' -n 10 "$tag" > notes.md
          fi
          gh release create "$tag" dist/*.apk \
            --title "魅窗 $tag" \
            --notes-file notes.md

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Parse version from tag
        id: v
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          name="${tag#v}"
          case "$name" in
            *.*.*) ;;
            *) echo "::error::tag '$tag' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          major="${name%%.*}"
          rest="${name#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          ls -l "$GITHUB_WORKSPACE/release.jks"

      - name: Build Release APK
        env:
          # Absolute path: the keystore is written at the repo root while Gradle resolves a relative
          # path against app/. A miss there used to fall back to the runner's random debug key.
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            "-PversionName=${{ steps.v.outputs.name }}" \
            "-PversionCode=${{ steps.v.outputs.code }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/MeiWindow-${{ steps.v.outputs.tag }}.apk"

      - name: Verify APK is signed with the release keystore
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk=$(ls dist/*.apk)
          norm() { tr -d ':\r' | tr 'A-F' 'a-f'; }

          # Digest of the key inside the keystore ("SHA256: AB:CD:…").
          want=$(keytool -list -v -keystore release.jks -storepass "$SIGNING_STORE_PASSWORD" \
                   -alias "$SIGNING_KEY_ALIAS" | grep -oE 'SHA256: [0-9A-Fa-f:]+' | head -1 \
                   | sed 's/.*SHA256: //' | norm)

          # Digest of the APK's signer. v1 first: build-tools ship as a v1 signature here
          # (enableV1Signing in app/build.gradle.kts) and keytool prints the same "SHA256: …"
          # label as above, so both sides are parsed identically. apksigner is the fallback for
          # a v2/v3-only APK; its label varies by build-tools ("Signer #1 certificate SHA-256
          # digest:" vs "V3.0 Signer: certificate SHA-256 digest:"), hence the loose match.
          got=$(keytool -printcert -jarfile "$apk" 2>/dev/null | grep -oE 'SHA256: [0-9A-Fa-f:]+' | head -1 \
                   | sed 's/.*SHA256: //' | norm)
          if [ -z "$got" ]; then
            sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            apksigner=$(ls -1 "$sdk"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
            if [ -z "$apksigner" ]; then
              echo "::error::apksigner not found under $sdk"
              exit 1
            fi
            got=$("$apksigner" verify --print-certs "$apk" \
                    | grep -oiE 'SHA-?256 digest: [0-9A-Fa-f:]+' | head -1 \
                    | sed 's/.*digest: //' | norm)
            "$apksigner" verify --print-certs "$apk" || true
          fi

          echo "keystore SHA-256: $want"
          echo "APK      SHA-256: $got"
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "::error::APK is NOT signed with SIGNING_KEYSTORE_BASE64 (debug-key fallback?)"
            exit 1
          fi

      - name: Verify LSPosed Metadata
        run: |
          set -euo pipefail
          apk=$(ls dist/*.apk)
          unzip -p "$apk" META-INF/xposed/java_init.list | grep -qx 'com.repl.bubbledrawer.xposed.ModuleMain'
          unzip -p "$apk" META-INF/xposed/scope.list | grep -qx 'com.android.systemui'
          echo "LSPosed entry point and scope verified."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.v.outputs.tag }}"
          git tag -l --format='%(contents)' "$tag" > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            git log --no-merges --pretty='- %s' -n 10 "$tag" > notes.md
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, updating assets and notes..."
            gh release upload "$tag" dist/*.apk --clobber
            gh release edit "$tag" --title "魅窗 $tag" --notes-file notes.md
          else
            gh release create "$tag" dist/*.apk \
              --title "魅窗 $tag" \
              --notes-file notes.md
          fi
